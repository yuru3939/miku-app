<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ミクアプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- タイトル画面 -->
    <div id="title-screen">

        <h1 id="title">マジカルミライ2026</h1>
        <p id="start-text">Click to Start</p>

    </div>

    <!-- 波紋 -->
    <div id="ripple"></div>

    <!-- 楽曲選択 -->
     <div id="song-screen" class="hidden">

     <h2>SONG SELECT</h2>


     <!-- ゲーム画面 -->
     <div id="game-screen" class="hidden">

      <h1>GAME START</h1>

        </div>
        
    <div class="song-card"
     data-song="miku"
     data-src="sound/BGM/みんなみくみくにしてあげる♪.wav">
    ミクミクにしてあげる！！！
</div>

    <div class="song-card"
    data-song="sora"
    data-src="sound/BGM/song2.mp3">
    空に免じて
    </div>

    <div class="song-card"
    data-song="kotae"
    data-src="sound/BGM/こたえて (feat. 初音ミク&鏡音リン&鏡音レン&巡音ルカ&MEIKO&KAITO) - imie.mp3">
    こたえて
    </div>

    <div class="song-card"
    data-song="ka-tenn"
    data-src="sound/BGM/song4.mp3">
    アフター・ザ・カーテン
    </div>

    <div class="song-card"
    data-song="tyannsu"
    data-src="sound/BGM/song5.mp3">
    シャッターチャンス
    </div>

    <div class="song-card"
    data-song="sekai"
    data-src="sound/BGM/song6.mp3">
    世界最後の音楽隊
       </div>

    </div>

       <!-- 歌詞画面 --->
        <div id="lyric-screen" class="hidden">
        <div id="lyric-text"></div>
       </div>

      <!-- 曲再生用 -->
       <audio id="bgmPlayer"></audio>


    <!-- 効果音 -->
    <audio id="audio" src="sound/Clap.mp3"></audio>

    <!-- BGM -->
    <audio id="bgm"
    src="sound/BGM/みんなみくみくにしてあげる♪.wav"
    loop></audio>

    <!-- JavaScript -->
    <script src="js/audio.js"></script>
    <script src="js/title.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
